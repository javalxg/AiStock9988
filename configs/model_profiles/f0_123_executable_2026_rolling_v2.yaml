identity:
  model_profile_id: f0_123_executable_2026_rolling_v2
  version: 2

feature_set:
  id: feature.f0_123.v1
  manifest: configs/feature_sets/f0_123_columns.json
  expected_columns: 123
  column_order_hash: 7f88c8912cd268a1bedd5034768ab73827bdce8f8d2f3870fe8fac3c26aa9e39
  transform: daily_cross_section_percentile_zscore
  minimum_non_null_features: 61
  maximum_training_rows_per_date: 1500
  missing_values: xgboost_native_nan_no_imputation

timeline:
  train_start: "2025-01-02"
  prediction_start: "2026-01-01"
  signal_end_policy: latest_common_source_session
  signal_cutoff_sources:
    - stock_factor_pro_ts
    - daily_basic_ts
    - market_daily_ts
    - adj_factor_ts
    - stk_limit_ts
  execution_end_policy: latest_common_source_session
  execution_cutoff_sources:
    - market_daily_ts
    - adj_factor_ts
    - stk_limit_ts
  require_complete_horizon: false
  train_window_months: 12
  retrain: monthly_first_weekly_signal
  prediction: every_week_last_session

label:
  profile: label.executable_path_open_open_t10_base.v1

model:
  family: xgboost
  objective: rank:pairwise
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 1.0
  reg_lambda: 1.0
  random_state: 42
  n_jobs: 1
  tree_method: hist

selection:
  full_market_scoring: true
  candidate_view_size: 20
  entries_per_decision: 5
  ranking: model_score_desc
  factor_gate: none

evaluation:
  cap1_base_return: 0.32440303113620117
  cap1_stress_return: 0.2848200792350013
  paired_control_required: false
  trade_win_rate_min: 0.70
  portfolio_profit_factor_min: 2.0
  max_drawdown_abs_max: 0.15
  minimum_closed_trades: 20
  maximum_positions: 5
  parameter_sweep: false
