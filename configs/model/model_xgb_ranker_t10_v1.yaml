model_id: model.xgb_ranker_t10.v1
enabled: false
algorithm: xgboost_ranker
feature_set_id: feature.f0_123.v1
label_profile_id: label.endpoint_open_open_t10.v1

training:
  window_months: 12
  retrain: monthly
  group_key: asof
  maturity_required: true
  objective: rank:pairwise
  seed: 42

prediction:
  candidate_scope: strategy_candidate_pool
  output: full_prediction_ledger
  top_n: 20

params:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 1.0
  reg_lambda: 1.0
  n_jobs: 1
  tree_method: hist
