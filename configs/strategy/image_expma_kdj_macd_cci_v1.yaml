identity:
  strategy_id: image_expma_kdj_macd_cci_v1
  version: 1
  mode: rules
  hypothesis_id: weekly_trend_oversold_daily_reclaim
  research_status: historical

universe:
  source: full_pit_universe
  codes_file: docs/council_20260828/FULL_UNIVERSE_2026_START.csv
  exclude_suffixes: [.BJ]
  exclude_pit_st: true
  require_listed_on_signal: true

data_policy:
  dense_required:
    selection: [market_daily_ts, adj_factor_ts, stk_limit_ts, index_daily_ts]
    training: [market_daily_ts, adj_factor_ts, stk_limit_ts, index_daily_ts]
    execution: [market_daily_ts, adj_factor_ts, stk_limit_ts]
  sparse_event: [stock_st_ts, suspend_d_ts, stk_auction_o_ts, corporate_actions]
  optional_enrichment: []
  source_availability:
    index_daily_ts: eod_trade_date_close
  missing_action:
    selection: exclude_stock_session
    training: exclude_sample
    entry: skip_and_ranked_fallback
    held_position: carry_last_mark_and_retry

decision:
  frequency: weekly
  session_selector: week_last_session
  decision_time: "15:00:00 Asia/Shanghai"
  entry_delay_sessions: 1

features:
  daily_macd: {provider: custom, source: economic_close, window_sessions: 26}
  daily_cci: {provider: custom, source: economic_high_low_close, window_sessions: 14}
  daily_rsi: {provider: custom, source: economic_close, window_sessions: 14}
  weekly_ema12: {provider: custom, source: weekly_economic_close, window_sessions: 12}
  # 50 weekly bars require roughly 250 exchange sessions of daily warm-up.
  weekly_ema50: {provider: custom, source: weekly_economic_close, window_sessions: 260}
  weekly_kdj: {provider: custom, source: weekly_economic_ohlc, window_sessions: 9}

stage1:
  expression:
    all:
      - {left: weekly_trend, op: ge, value: 1.0}
      - {left: weekly_j_oversold, op: ge, value: 1.0}
      - {left: daily_macd_cross, op: ge, value: 1.0}
      - {left: daily_cci_cross_100, op: ge, value: 1.0}
      - {left: selection_data_eligible, op: ge, value: 1.0}

ranking:
  method: stable_ts_code_asc
  terms:
    - {feature: stable_rank, direction: asc, weight: 1.0}
  tie_breakers: [ts_code_asc]

portfolio:
  candidate_view_size: 20
  entries_per_decision: 5
  max_open_positions: 5
  target_gross_exposure_cap: 0.50
  sizing: {method: fixed_fraction_of_decision_nav, value: 0.10}
  duplicate_symbol: skip
  exit_pending_occupies_slot: true
  candidate_min_daily_view_ratio: 0.0

execution:
  initial_cash: 1000000.0
  entry_price: next_session_raw_open
  hold_sessions_from_fill: 10
  exit_price: next_tradable_raw_open
  buy_untradable: same_decision_ranked_replacement
  sell_untradable: retain_and_retry
  stop:
    trigger: close
    threshold_pct: -0.08
    execute: next_tradable_open
  lot_size: 100
  accounting_basis: raw_with_corporate_actions
  amount_unit: thousand_rmb
  amount_unit_multiplier: 1000.0
  adv20_max_participation: 0.02
  end_policy: mark_open_positions
  cost_scenarios:
    base: {slippage_each_side: 0.001, buy_commission: 0.0003, sell_commission: 0.0003, stamp_duty: 0.0005}
    stress: {slippage_each_side: 0.003, buy_commission: 0.0003, sell_commission: 0.0003, stamp_duty: 0.0005}

acceptance:
  portfolio_profit_factor_min: 2.0
  max_drawdown_abs_max: 0.15
  return_excluding_best_week_min_exclusive: 0.0
  parameter_sweep: false
